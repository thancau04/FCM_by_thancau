apply plugin: 'com.android.application'

android {
    namespace "com.thancau.setedit"
    compileSdk 34

    defaultConfig {
        applicationId "com.thancau.setedit"
        minSdk 26
        //noinspection ExpiredTargetSdkVersion
        targetSdk 22
        versionCode 9
        versionName "1.0.1"
        resConfig "en"
    }

    Properties localProps = new Properties()
    File localPropsFile = project.rootProject.file('local.properties')
    if (localPropsFile.exists()) {
        localPropsFile.withInputStream { localProps.load(it) }
    }

    signingConfigs {
        debug {
            File keystoreFile = file('dev_keystore.jks')
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: localProps.getProperty('keystore.password', '')
                keyPassword System.getenv("KEY_PASSWORD") ?: localProps.getProperty('key.password', '')
                keyAlias System.getenv("KEY_ALIAS") ?: localProps.getProperty('key.alias', 'key0')
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }

    splits {
        abi {
            enable false
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            universalApk true
        }
    }

    def archPrefix = ['armeabi-v7a': 4, 'arm64-v8a': 2, 'x86': 3, 'x86_64': 1]

    android.applicationVariants.all { variant ->
        variant.outputs.each { output ->
            int abiVersionCode = archPrefix.get(output.getFilter('ABI'), 0)
            output.versionCodeOverride = (abiVersionCode * 100000) + defaultConfig.versionCode
            output.outputFileName = "SetEdit-v${variant.versionName}-${variant.buildType.name}.apk"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            File keystoreFile = file('dev_keystore.jks')
            String kPass = System.getenv("KEYSTORE_PASSWORD") ?: localProps.getProperty('keystore.password', '')
            if (keystoreFile.exists() && !kPass.isEmpty()) {
                signingConfig signingConfigs.debug
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'me.zhanghai.android.fastscroll:library:1.3.0'
    implementation 'com.github.topjohnwu.libsu:core:5.2.2'
}